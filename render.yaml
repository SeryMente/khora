# @l0 L0-002-R · @req DEPLOY-01/REQ-1 · @acr ACR-1.1
services:
  - type: web
    name: khora-api
    env: python
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
