[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comind"
version = "0.0.0"
description = "CoMind"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "fastapi", "uvicorn[standard]"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["src", "tests"]
