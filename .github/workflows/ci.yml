name: CI
on: [push, pull_request]
jobs:
  calidad:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: pyright
      - name: Start Neo4j
        run: docker compose up -d
        working-directory: kernel
      - run: pytest
