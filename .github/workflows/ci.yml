name: CI
on: [push, pull_request]
jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e kernel/ ruff pyright pytest
      - run: ruff check .
        working-directory: kernel
      - run: pyright
        working-directory: kernel
      - name: Start Neo4j
        working-directory: kernel
        run: docker compose up -d
      - name: Wait for Neo4j and setup schema
        run: python kernel/scripts/setup_neo4j.py
      - run: pytest
        working-directory: kernel

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r api/requirements.txt
      - run: pip install pytest httpx
      - run: pytest api/tests/
