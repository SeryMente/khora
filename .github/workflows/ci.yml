name: CI
on: [push, pull_request]
jobs:
  calidad:
    runs-on: ubuntu-latest
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4jpassword
      KHORA_NEO4J_TEST_URI: bolt://localhost:7687
      KHORA_NEO4J_TEST_USER: neo4j
      KHORA_NEO4J_TEST_PASS: neo4jpassword
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/kernel/src
      KHORA_EMB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --no-cache-dir -e "kernel/[ci]" ruff pyright pytest pytest-mock
      - run: ruff check .
        working-directory: kernel
      - run: pyright
        working-directory: kernel
      - name: Start Neo4j
        run: cd kernel && docker compose up -d
      - name: Wait for Neo4j and setup schema
        run: python kernel/scripts/setup_neo4j.py
      - run: pytest
        working-directory: kernel

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r api/requirements.txt
      - run: pip install pytest httpx
      - run: pytest api/tests/

  khora-web-gate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3999
      PLAYWRIGHT_TEST_RUN: "1"
      PLAYWRIGHT_TEST_BYPASS: "true"
      AUTH_SECRET: test-secret-12345678901234567890123456789012
      X_KHORA_KEY: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
      MCP_OAUTH_CLIENT_ID: mock-client-id
      MCP_OAUTH_CLIENT_SECRET: mock-client-secret
      MCP_OAUTH_REDIRECT_URIS: http://localhost:3000/callback
      MCP_JWT_SECRET: mock-jwt-secret-at-least-32-chars-long
      MCP_ALLOWED_EMAIL: test@example.com
      MCP_CANONICAL_URL: http://localhost:3000/api/mcp
      KHORA_READONLY_DATABASE_URL: postgres://localhost:5432/mock
      DATABASE_URL: postgres://localhost:5432/mock
      KHORA_UI_REVIEW_MODE: "1"
    defaults:
      run:
        working-directory: khora-web  
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run ui-review:check
      - run: npm run ui:contract
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium e2e/dictado-cronica.spec.ts e2e/titulo-auto.spec.ts e2e/dialogo-live.spec.ts
