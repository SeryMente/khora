name: CI
on: [push, pull_request]
jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalacion
        run: |
          cd kernel
          pip install -e ".[dev]"
      - name: ruff
        run: |
          cd kernel
          ruff check .
      - name: pyright
        run: |
          cd kernel
          pyright
      - name: Start Neo4j
        run: docker compose up -d
      - name: Wait for Neo4j and setup schema
        run: python scripts/setup_neo4j.py
      - name: pytest
        run: |
          cd kernel
          pytest
