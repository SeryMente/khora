name: CI
on: [push, pull_request]
jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cd kernel && pip install -e . ruff pyright pytest
      - run: cd kernel && ruff check .
      - run: cd kernel && pyright
      - name: Start Neo4j
        run: docker compose up -d
      - name: Wait for Neo4j and setup schema
        run: python scripts/setup_neo4j.py
      - run: cd kernel && pytest
