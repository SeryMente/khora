name: CI
on: [push, pull_request]
jobs:
  calidad:
    runs-on: ubuntu-latest
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4jpassword
      KHORA_NEO4J_TEST_URI: bolt://localhost:7687
      KHORA_NEO4J_TEST_USER: neo4j
      KHORA_NEO4J_TEST_PASS: neo4jpassword
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/kernel/src
      KHORA_EMB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --no-cache-dir -e "kernel/[ci]" ruff pyright pytest pytest-mock
      - run: ruff check .
        working-directory: kernel
      - run: pyright
        working-directory: kernel
      - name: Start Neo4j
        run: cd kernel && docker compose up -d
      - name: Wait for Neo4j and setup schema
        run: python kernel/scripts/setup_neo4j.py
      - run: pytest
        working-directory: kernel

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r api/requirements.txt
      - run: pip install pytest httpx
      - run: pytest api/tests/

  khora-web-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: khora-web  
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run ui-review:check
      - run: npm run ui:contract
      - run: npm run test:unit
