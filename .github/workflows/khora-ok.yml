name: khora-ok / gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: khora-ok-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  khora-ok:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: khora-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: khora-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('khora-web/package-lock.json') }}
      - run: npx playwright install --with-deps
      - run: npm run e2e
      - run: npx playwright test tests/regression/smoke.spec.ts --project=chromium
