name: integrity-audit-temp

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SHA256 Batch 1
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            khora-web/middleware.ts \
            khora-web/extension/harmonia/core/telemetry.js \
            khora-web/extension/harmonia/core/shell.sw.js \
            khora-web/extension/harmonia/modules/live-caption/background.js \
            khora-web/lib/contracts/observation-batch.ts \
            khora-ok.ps1 \
            .github/workflows/deploy-production.yml \
            khora-web/tests/unit/observation_scheduler.test.ts \
            khora-web/tests/unit/observation_batch.test.ts
          do
            sha256sum "$f"
          done
