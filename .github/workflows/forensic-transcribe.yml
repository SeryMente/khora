name: Forensic transcription — maximum quality
on:
  push:
    branches: [main]
    paths:
      - "data/volcados/2026-10-05-Vocaroo-184Eqk8BMLcF.mp3"
      - ".github/workflows/forensic-transcribe.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AUDIO_PATH: data/volcados/2026-10-05-Vocaroo-184Eqk8BMLcF.mp3
  EXPECTED_SHA256: c64f949012a4f141f6eded1b2aa69ad69d3961c02b4b3ca220c541ec456834e3

jobs:
  transcribe:
    name: large-v3 forensic battery
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Faster-Whisper
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir "faster-whisper" "av<19"

      - name: Verify immutable audio
        run: |
          actual="$(sha256sum "$AUDIO_PATH" | awk '{print $1}')"
          echo "AUDIO_SHA256=$actual"
          test "$actual" = "$EXPECTED_SHA256"

      - name: Run large-v3 forensic battery
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from faster_whisper import WhisperModel

          audio = Path(os.environ["AUDIO_PATH"])
          outdir = Path("forensic-output")
          outdir.mkdir(parents=True, exist_ok=True)

          sha256 = hashlib.sha256(audio.read_bytes()).hexdigest()
          if sha256 != os.environ["EXPECTED_SHA256"]:
              raise SystemExit(f"Audio SHA mismatch: {sha256}")

          model = WhisperModel(
              "large-v3",
              device="cpu",
              compute_type="int8",
          )

          presets = [
              {
                  "name": "ctx-beam5",
                  "beam_size": 5,
                  "condition_on_previous_text": True,
              },
              {
                  "name": "ctx-beam10",
                  "beam_size": 10,
                  "condition_on_previous_text": True,
              },
              {
                  "name": "noctx-beam5",
                  "beam_size": 5,
                  "condition_on_previous_text": False,
              },
          ]

          for preset in presets:
              print(
                  f"START preset={preset['name']} "
                  f"beam={preset['beam_size']} "
                  f"context={preset['condition_on_previous_text']}",
                  flush=True,
              )

              segments, info = model.transcribe(
                  str(audio),
                  language="es",
                  task="transcribe",
                  temperature=0.0,
                  beam_size=preset["beam_size"],
                  condition_on_previous_text=preset["condition_on_previous_text"],
                  vad_filter=False,
                  word_timestamps=True,
              )

              segment_list = []
              words = []
              text_parts = []

              for seg in segments:
                  segment_words = []
                  if seg.words:
                      for w in seg.words:
                          item = {
                              "start": float(w.start),
                              "end": float(w.end),
                              "word": w.word,
                              "probability": float(w.probability),
                          }
                          segment_words.append(item)
                          words.append(item)

                  segment_list.append({
                      "id": int(seg.id),
                      "start": float(seg.start),
                      "end": float(seg.end),
                      "text": seg.text,
                      "words": segment_words,
                  })
                  text_parts.append(seg.text)

              result = {
                  "audio_file": str(audio).replace("\\", "/"),
                  "audio_sha256": sha256,
                  "model": "faster-whisper / large-v3",
                  "decode": {
                      "beam_size": preset["beam_size"],
                      "condition_on_previous_text": preset["condition_on_previous_text"],
                      "temperature": 0.0,
                      "vad_filter": False,
                      "word_timestamps": True,
                  },
                  "language": info.language,
                  "language_probability": float(info.language_probability),
                  "duration_seconds": float(info.duration),
                  "text": "".join(text_parts).strip(),
                  "segments": segment_list,
                  "word_count": len(words),
              }

              target = outdir / preset["name"]
              target.mkdir(parents=True, exist_ok=True)
              (target / "result.json").write_text(
                  json.dumps(result, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )
              (target / "result.txt").write_text(
                  result["text"] + "\n",
                  encoding="utf-8",
              )

              print(
                  f"DONE preset={preset['name']} "
                  f"duration={info.duration} "
                  f"words={len(words)}",
                  flush=True,
              )

          manifest = {
              "audio_sha256": sha256,
              "model": "faster-whisper / large-v3",
              "presets": [p["name"] for p in presets],
          }
          (outdir / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload forensic outputs
        uses: actions/upload-artifact@v4
        with:
          name: forensic-large-v3-maximum-quality
          path: forensic-output/
          if-no-files-found: error
          retention-days: 14
