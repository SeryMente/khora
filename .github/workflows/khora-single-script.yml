name: Khora Single Script Guard
on:
  pull_request:
    paths: [scripts/khora/**, .github/workflows/khora-single-script.yml]
  push:
    branches: [main]
    paths: [scripts/khora/**, .github/workflows/khora-single-script.yml]
jobs:
  validate-khora-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Anti-fragmentation and gate+barrel presence
        run: |
          C=$(ls scripts/khora/khora-v*.ps1 2>/dev/null | wc -l)
          [ "$C" -eq 0 ] || { echo "khora-v*.ps1 monolith(s) present (v7 prohibits)"; ls scripts/khora/khora-v*.ps1; exit 1; }
          test -f scripts/khora/khora.ps1 || { echo missing khora.ps1; exit 1; }
          test -f scripts/khora/khora.barrel.ps1 || { echo missing khora.barrel.ps1; exit 1; }
          echo OK
      - name: Parse and denylist across tree
        shell: pwsh
        run: |
          $fail = $false
          $deny = @('CipherMode]::GCM','AesGcm','RandomNumberGenerator]::Fill','-AsHashtable')
          Get-ChildItem -Path scripts/khora -Recurse -Filter *.ps1 -File | ForEach-Object {
            $e = $null; $t = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$t, [ref]$e) | Out-Null
            if ($e -and $e.Count -gt 0) { Write-Host "PARSE-ERR $($_.FullName)"; $e | ForEach-Object { Write-Host $_.Message }; $fail = $true } else { Write-Host "OK-PARSE $($_.FullName)" }
            $c = Get-Content -Raw $_.FullName
            foreach ($p in $deny) { if ($c -match [regex]::Escape($p)) { Write-Host "DENY $p in $($_.FullName)"; $fail = $true } }
          }
          if ($fail) { exit 1 } else { Write-Host "Validation passed successfully." }
