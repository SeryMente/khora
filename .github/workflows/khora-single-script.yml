name: Khora Single Script Guard

on:
  pull_request:
    paths:
      - 'scripts/khora/**'
  push:
    branches:
      - main
    paths:
      - 'scripts/khora/**'

jobs:
  validate-khora-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check script uniqueness
        run: |
          COUNT=$(ls scripts/khora/khora-v*.ps1 2>/dev/null | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "Error: There must be exactly one khora-v*.ps1 script. Found $COUNT."
            exit 1
          fi

      - name: Validate Integrity (Parser & Denylist)
        shell: pwsh
        run: |
          $scriptPath = Get-ChildItem -Path scripts/khora/khora-v*.ps1 | Select-Object -First 1 -ExpandProperty FullName
          if (-not $scriptPath) {
            Write-Host "No script found."
            exit 1
          }

          $errs = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$errs)

          if ($errs -and $errs.Count -gt 0) {
            Write-Host "Syntax Errors Found in $($scriptPath):"
            $errs | ForEach-Object { Write-Host $_.Message }
            exit 1
          }

          # Denylist check
          $denylist = @(
            "CipherMode]::GCM",
            "AesGcm",
            "RandomNumberGenerator]::Fill",
            "-AsHashtable",
            "echo `$Value"
          )

          $content = Get-Content -Raw $scriptPath
          $foundInvalid = $false
          foreach ($pattern in $denylist) {
            if ($content -match [regex]::Escape($pattern)) {
              Write-Host "Error: Prohibited pattern '$pattern' found in the script."
              $foundInvalid = $true
            }
          }

          if ($foundInvalid) {
            exit 1
          }

          Write-Host "Validation passed successfully."
