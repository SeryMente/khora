name: Sync Todoist and Notion

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: khora-web
        run: npm install ts-node typescript --no-save

      - name: Run Sync
        working-directory: scripts
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          TODOIST_TOKEN: ${{ secrets.TODOIST_TOKEN }}
        run: npx ts-node sync-todoist-notion.ts
