name: Output Contract Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "khora-web/**"
      - ".github/workflows/output-contract-diagnostic.yml"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Contract sync
        shell: bash
        run: |
          set +e
          node khora-web/scripts/check_output_contract_sync.mjs > /tmp/sync.log 2>&1
          echo $? > /tmp/sync.code

      - name: Contract integration
        shell: bash
        run: |
          set +e
          node khora-web/scripts/check_output_contract_integration.mjs > /tmp/integration.log 2>&1
          echo $? > /tmp/integration.code

      - name: Contract tests
        shell: bash
        run: |
          set +e
          node --experimental-strip-types khora-web/tests/unit/output-contract.test.ts > /tmp/tests.log 2>&1
          echo $? > /tmp/tests.code

      - name: Publish diagnostic
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (path) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8').slice(-6000) : '(no log)';
            const code = (path) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8').trim() : '(no code)';
            const body = [
              '## Output Contract Diagnostic',
              '```text',
              'sync exit=' + code('/tmp/sync.code'),
              read('/tmp/sync.log'),
              'integration exit=' + code('/tmp/integration.code'),
              read('/tmp/integration.log'),
              'tests exit=' + code('/tmp/tests.code'),
              read('/tmp/tests.log'),
              '```',
            ].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            const failed = ['/tmp/sync.code','/tmp/integration.code','/tmp/tests.code'].map(code).some(v => v !== '0');
            if (failed) core.setFailed('Output Contract diagnostic detected a failure.');
