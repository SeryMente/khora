name: Output Contract Diagnostic

on:
  push:
    branches:
      - feat/strict-cycle-output-contract

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: khora-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: khora-web/package-lock.json

      - name: Run diagnostics
        shell: bash
        run: |
          set +e
          npm ci > npm-ci.log 2>&1
          npm_ci=$?
          npm run output:contract:check > contract.log 2>&1
          contract=$?
          npm run typecheck > typecheck.log 2>&1
          typecheck=$?
          npx tsx tests/unit/output-contract.test.ts > tests.log 2>&1
          tests=$?
          printf '{"npm_ci":%s,"contract":%s,"typecheck":%s,"tests":%s}
' "$npm_ci" "$contract" "$typecheck" "$tests" > exit-codes.json
          exit 0

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-contract-diagnostic
          path: |
            khora-web/npm-ci.log
            khora-web/contract.log
            khora-web/typecheck.log
            khora-web/tests.log
            khora-web/exit-codes.json
          if-no-files-found: warn
