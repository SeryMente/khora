name: HARMONIA local-first adapter

on:
  push:
    branches:
      - feat/harmonia-ep-local-first-adapter-20261101
    paths:
      - "apps/harmonia-observability/**"
      - ".github/workflows/harmonia-local-first.yml"
  pull_request:
    paths:
      - "apps/harmonia-observability/**"
      - ".github/workflows/harmonia-local-first.yml"

permissions:
  contents: read

jobs:
  local-first-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install IndexedDB test shim
        run: npm install --no-save --ignore-scripts fake-indexeddb@6.2.7
      - name: JavaScript syntax
        run: |
          node --check apps/harmonia-observability/extension/durable-outbox.js
          node --check apps/harmonia-observability/extension/service-worker.js
          node --check apps/harmonia-observability/extension/popup.js
          node --check apps/harmonia-observability/collector/ep-consumer-adapter.js
          node --check apps/harmonia-observability/collector/server.js
          node --check apps/harmonia-observability/collector/tests/ep-consumer-adapter.test.js
          node --check apps/harmonia-observability/collector/tests/server-local-first.integration.test.js
          node --check apps/harmonia-observability/extension/tests/durable-outbox.test.js
      - name: Durable local outbox and EP ledger tests
        run: node --test apps/harmonia-observability/extension/tests/durable-outbox.test.js apps/harmonia-observability/collector/tests/ep-consumer-adapter.test.js apps/harmonia-observability/collector/tests/server-local-first.integration.test.js
