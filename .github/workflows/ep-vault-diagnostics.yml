name: EP Vault Diagnostics (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - "khora-web/**"
      - "scripts/khora/**"
      - ".github/workflows/ep-vault-diagnostics.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ep-vault-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose without checkout action
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch source and publish sanitized diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/ep-vault-diagnostics"
          SRC="$RUNNER_TEMP/ep-vault-source"
          mkdir -p "$D" "$SRC"
          printf 'Node: ' > "$D/runtime.log"
          node --version >> "$D/runtime.log" 2>&1
          printf 'npm: ' >> "$D/runtime.log"
          npm --version >> "$D/runtime.log" 2>&1
          printf 'Fetching %s@%s from GitHub API\n' "$GH_REPO" "$HEAD_SHA" > "$D/source-download.log"
          curl --location --silent --show-error --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$D/source.tar.gz" \
            --write-out 'HTTP %{http_code}\n' \
            "https://api.github.com/repos/$GH_REPO/tarball/$HEAD_SHA" >> "$D/source-download.log" 2>&1
          fetch_code=$?
          echo "$fetch_code" > "$D/source-download.exit"
          if [ "$fetch_code" -eq 0 ] && [ -s "$D/source.tar.gz" ]; then
            tar -xzf "$D/source.tar.gz" --strip-components=1 -C "$SRC" > "$D/extract.log" 2>&1
            echo "$?" > "$D/extract.exit"
          else
            echo "1" > "$D/extract.exit"
          fi

          if [ -f "$SRC/khora-web/package.json" ]; then
            cd "$SRC/khora-web"
            npm ci > "$D/npm-ci.log" 2>&1
            echo "$?" > "$D/npm-ci.exit"
            npm run typecheck > "$D/typecheck.log" 2>&1
            echo "$?" > "$D/typecheck.exit"
            npm run ui-review:check > "$D/ui-review.log" 2>&1
            echo "$?" > "$D/ui-review.exit"
            npm run ui:contract > "$D/ui-contract.log" 2>&1
            echo "$?" > "$D/ui-contract.exit"
            npm run test:unit > "$D/unit-tests.log" 2>&1
            echo "$?" > "$D/unit-tests.exit"
            npx playwright install --with-deps chromium > "$D/playwright-install.log" 2>&1
            echo "$?" > "$D/playwright-install.exit"
            npm run e2e -- e2e/shell-v2.spec.ts e2e/ui-quality.spec.ts > "$D/ui-e2e.log" 2>&1
            echo "$?" > "$D/ui-e2e.exit"
          else
            echo "Repository source not available; Node checks skipped." > "$D/source-unavailable.log"
          fi

          if command -v pwsh >/dev/null 2>&1 && [ -d "$SRC/scripts/khora" ]; then
            cd "$SRC"
            pwsh -NoProfile -Command '
              $ErrorActionPreference = "Continue"
              $failed = $false
              $deny = @("CipherMode]::GCM", "AesGcm", "RandomNumberGenerator]::Fill", "-AsHashtable")
              Get-ChildItem scripts/khora -Recurse -Filter *.ps1 -File | ForEach-Object {
                $parseErrors = $null; $tokens = $null
                [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
                if ($parseErrors -and $parseErrors.Count -gt 0) { "PARSE-ERR $($_.FullName)"; $parseErrors | ForEach-Object { $_.Message }; $failed = $true }
                $text = Get-Content -Raw $_.FullName
                foreach ($pattern in $deny) { if ($text -match [regex]::Escape($pattern)) { "DENY $pattern $($_.FullName)"; $failed = $true } }
              }
              if ($failed) { exit 1 } else { "PowerShell parser and denylist passed"; exit 0 }
            ' > "$D/powershell-parser.log" 2>&1
            echo "$?" > "$D/powershell-parser.exit"
          else
            echo "pwsh unavailable on diagnostic runner." > "$D/powershell-parser.log"
            echo "2" > "$D/powershell-parser.exit"
          fi

          node - "$D" "$GH_REPO" "$PR_NUMBER" "$HEAD_SHA" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const root = process.argv[2];
          const repo = process.argv[3];
          const pr = process.argv[4];
          const sha = process.argv[5];
          const names = [
            "runtime.log", "source-download.log", "extract.log", "source-unavailable.log",
            "npm-ci.log", "typecheck.log", "ui-review.log", "ui-contract.log",
            "unit-tests.log", "playwright-install.log", "ui-e2e.log", "powershell-parser.log"
          ];
          const redact = (s) => s
            .replace(/(?:ghp_|github_pat_|gho_)[A-Za-z0-9_]{16,}/g, "[REDACTED_GITHUB_TOKEN]")
            .replace(/Bearer\s+[^\s"'<>]+/gi, "Bearer [REDACTED]")
            .replace(/(EP_BOOTSTRAP_JWT_SECRET|GITHUB_TOKEN|password)\s*[:=]\s*[^\s"'<>]+/gi, "$1=[REDACTED]");
          const sections = [];
          for (const name of names) {
            const full = path.join(root, name);
            if (!fs.existsSync(full)) continue;
            let body = redact(fs.readFileSync(full, "utf8"));
            const codePath = full.replace(/\.log$/, ".exit");
            const code = fs.existsSync(codePath) ? fs.readFileSync(codePath, "utf8").trim() : "not-run";
            if (body.length > 7000) body = "[truncated to last lines]\n" + body.slice(-7000);
            sections.push("### " + name + " · exit=" + code + "\n\n\x60\x60\x60text\n" + body + "\n\x60\x60\x60");
          }
          const content = "Temporary diagnostics for " + repo + " PR #" + pr + "\nHead: " + sha +
            "\n\nLogs are captured from this isolated run and secrets are redacted.\n\n" + sections.join("\n\n");
          fs.writeFileSync(path.join(root, "comment.json"), JSON.stringify({body: content.slice(0, 58000)}));
          NODE
          comment_code=1
          if [ -f "$D/comment.json" ] && [ -n "$GH_TOKEN" ]; then
            curl --silent --show-error --output "$D/comment-response.json" --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --data-binary @"$D/comment.json" \
              "https://api.github.com/repos/$GH_REPO/issues/$PR_NUMBER/comments" > "$D/comment-status.txt" 2> "$D/comment-error.log"
            comment_code=$?
          fi
          echo "diagnostic-comment-curl-exit=$comment_code" >> "$D/runtime.log"
          cat "$D/runtime.log"
          echo "Logs were posted as a sanitized PR comment if the GitHub token allowed comments."
          exit 0
