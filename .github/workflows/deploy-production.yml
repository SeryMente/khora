name: Deploy to Production (Vercel)

concurrency:
  group: khora-production
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy-and-notify:
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Deployment
        id: create_deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const response = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'Production',
              auto_merge: false,
              required_contexts: [],
              production_environment: true
            });
            return response.data.id;

      - name: Stamp exact main provenance
        shell: bash
        run: |
          mkdir -p khora-web/public
          cat > khora-web/public/ep-main-live.json <<EOF
          {"schema":"khora-live-main/v1","branch":"main","commitSha":"${GITHUB_SHA}","publishedUtc":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF

      - name: Install Node and Vercel CLI
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: khora-web
        run: npm ci

      - name: Pull Vercel Project Settings
        run: npx vercel pull --yes --environment=production --token=${VERCEL_TOKEN}

      - name: Build Vercel Project
        run: npx vercel build --prod --token=${VERCEL_TOKEN}

      - name: Deploy to Vercel
        id: vercel_deploy
        run: |
          DEPLOY_URL=$(npx vercel deploy --prebuilt --prod --archive=tgz --token=${VERCEL_TOKEN})
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
          echo "Vercel Deployment URL: $DEPLOY_URL"

      - name: Verify exact main provenance
        shell: bash
        run: |
          for attempt in {1..30}; do
            PROOF_FILE=$(mktemp)
            if npx vercel curl "https://khora-web.vercel.app/ep-main-live.json?sha=${GITHUB_SHA}" -fsS -o "${PROOF_FILE}" >/dev/null 2>&1 &&
               jq -e --arg sha "${GITHUB_SHA}" '.branch=="main" and .commitSha==$sha' "${PROOF_FILE}" >/dev/null 2>&1; then
              rm -f "${PROOF_FILE}"
              exit 0
            fi
            rm -f "${PROOF_FILE}"
            sleep 2
          done
          echo "Vercel no acredita el SHA exacto de main: ${GITHUB_SHA}"
          exit 1

      - name: Post-deploy smoke check
        run: npx vercel curl https://khora-web.vercel.app/ -fsS -o /dev/null

      - name: Set Deployment Status (Success)
        if: success()
        env:
          DEPLOYMENT_ID: ${{ steps.create_deployment.outputs.result }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (!process.env.DEPLOYMENT_ID) return;
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: parseInt(process.env.DEPLOYMENT_ID, 10),
              state: 'success',
              environment_url: process.env.DEPLOY_URL,
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Set Deployment Status (Failure)
        if: failure()
        env:
          DEPLOYMENT_ID: ${{ steps.create_deployment.outputs.result }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (!process.env.DEPLOYMENT_ID) return;
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: parseInt(process.env.DEPLOYMENT_ID, 10),
              state: 'failure',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
