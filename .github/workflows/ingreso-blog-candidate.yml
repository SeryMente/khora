name: Ingreso and Blog candidate gates
on:
  push:
    branches: [feat/ingreso-autobiografico-20261019]
  pull_request:
    paths:
      - 'khora-web/**'
      - '.github/workflows/ingreso-blog-candidate.yml'
permissions:
  contents: read
jobs:
  full-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: khora-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: khora-web/package-lock.json
      - run: npm ci
      - name: Full prebuild and Next build (no skipped gates)
        run: npm run build
  isolated-editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: khora-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
      - name: Unit and isolated PostgreSQL regressions
        shell: bash
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          npm install --prefix "$T" --no-audit --no-fund @electric-sql/pglite@0.5.10
          BLOG_TEST_PGLITE_MODULE="file://$T/node_modules/@electric-sql/pglite/dist/index.js" node --experimental-strip-types --import ./tests/unit/blog-register.mjs --test tests/unit/blog-editorial.test.ts tests/unit/blog-postgres.test.ts tests/unit/custodia-hardening.test.ts tests/unit/blog-transcript-preparation.test.ts
