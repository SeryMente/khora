[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "khora-kernel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
khora = "khora_kernel.registro.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock", "pyright>=1.1", "ruff>=0.4", "import-linter>=2.0", "testcontainers", "neo4j", "faiss-cpu", "numpy", "sentence-transformers", "igraph", "leidenalg"]

[tool.pyright]
include = ["src"]

ignore = ["src/khora_kernel/poblacion/tests/*", "src/khora_kernel/summaries.py", "src/khora_kernel/summaries/fsum.py", "src/khora_kernel/proveedores/openai.py", "src/khora_kernel/psi.py", "src/khora_kernel/motor/_memoria.py", "src/khora_kernel/motor/tests/*", "src/khora_kernel/communities.py", "src/khora_kernel/engine/orchestrator.py", "src/khora_kernel/poblacion/_ingestar.py", "src/khora_kernel/consulta/retriever.py", "src/khora_kernel/constructor/*", "src/khora_kernel/embeddings.py"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["src"]

[tool.importlinter]
root_packages = ["khora_kernel"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Frontera kernel — api solo usa stdlib"
type = "forbidden"
source_modules = ["khora_kernel.api"]
forbidden_modules = ["khora_kernel.ports.mocks", "khora_kernel.drivers", "khora_kernel.shell"]
unresolved_modules = ["ignore"]

[[tool.importlinter.contracts]]
name = "Drivers no importan shell"
type = "forbidden"
source_modules = ["khora_kernel.drivers"]
forbidden_modules = ["khora_kernel.shell"]
unresolved_modules = ["ignore"]

[[tool.importlinter.contracts]]
name = "Userland solo ve puertos"
type = "forbidden"
source_modules = ["khora_kernel.userland"]
forbidden_modules = ["khora_kernel.api", "khora_kernel.drivers", "khora_kernel.shell", "khora_kernel.tests"]
unresolved_modules = ["ignore"]

[[tool.importlinter.contracts]]
name = "Nadie importa khora-web"
type = "forbidden"
source_modules = ["khora_kernel"]
forbidden_modules = ["khora_web"]
unresolved_modules = ["ignore"]
