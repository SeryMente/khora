[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "khora-kernel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pyright>=1.1", "ruff>=0.4"]

[tool.pyright]
include = ["src"]
strict = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["src"]
